[project]
name = "pyagent"
version = "0.1.0"
description = "Pythonic, Pydantic-first control-plane library for the Pi agent ecosystem."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "PyAgent Maintainers" },
]

dependencies = [
  "pydantic>=2.12.5",
  "sqlmodel>=0.0.24",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10.6",
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "ruff>=0.5.0",
  "ty>=0.0.1a16",
]

#[project.urls]
#homepage = "https://github.com/Bullish-Design/template-py"
#repository = "https://github.com/Bullish-Design/template-py.git"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell hatch which package to ship (your code lives in src/pyagent)
packages = ["src/pyagent"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
#  "SPEC.md",
#  "docs",
  "tests",
  "pyproject.toml",
]

[tool.uv]
# Keep the default behavior; this section is here so you can extend it later if needed.

[tool.pytest.ini_options]
addopts = "-q --cov=pyagent --cov-report=term-missing"
testpaths = ["tests"]

[tool.uv.scripts]
lint = "ruff check ."
lint_fix = "ruff check . --fix"
format = "ruff format ."
format_check = "ruff format . --check"
typecheck = "ty check src"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
